# Lint, type check, unit + integration tests (with ffmpeg) and build on every push and PR.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Fail instead of skipping the simulator tests if ffmpeg is unusable.
      REQUIRE_FFMPEG: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: ./.github/actions/setup-ffmpeg
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
      - run: npm test
