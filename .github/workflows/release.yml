# On a version tag (v0.2.0): test, build the Windows package and attach it to a release.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    env:
      # Fail instead of skipping the simulator tests if ffmpeg is unusable.
      REQUIRE_FFMPEG: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and tags for the release notes (commits since the previous tag).
          fetch-depth: 0
      - name: Tag must match package.json
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version $version" >&2
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: ./.github/actions/setup-ffmpeg
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run package:windows
      - name: Create release with notes, ZIP and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          zip="$(ls release/drone-live-stream-hub-*-win-x64.zip)"
          name="$(basename "$zip")"
          (cd release && sha256sum "$name" > "$name.sha256")
          sha="$(cut -d' ' -f1 "$zip.sha256")"
          npx tsx scripts/release-notes.ts "${GITHUB_REF_NAME}" --zip "$zip" --sha256 "$sha" --repo-url "$REPO_URL" > release/notes.md
          cat release/notes.md
          gh release create "${GITHUB_REF_NAME}" "$zip" "$zip.sha256" \
            --title "${GITHUB_REF_NAME}" --notes-file release/notes.md --verify-tag
