# On a version tag (v0.2.0): test, build the Windows package and attach it to a release.
# "Run workflow" with a tag builds a release for an existing tag (e.g. one pushed before
# this workflow existed); the tag's code is built, with the CI setup from the chosen branch.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, e.g. v0.7.0
        required: true

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    env:
      # Fail instead of skipping the simulator tests if ffmpeg is unusable.
      REQUIRE_FFMPEG: "1"
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
          # Full history and tags for the release notes (commits since the previous tag).
          fetch-depth: 0
      - name: Use the CI setup of the workflow's commit
        run: git checkout "$GITHUB_SHA" -- .github
      - name: Tag must match package.json
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "v$version" != "$TAG" ]; then
            echo "Tag $TAG does not match package.json version $version" >&2
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: ./.github/actions/setup-ffmpeg
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run package:windows
      - name: Create release with notes, ZIP and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          zip="$(ls release/drone-live-stream-hub-*-win-x64.zip)"
          name="$(basename "$zip")"
          (cd release && sha256sum "$name" > "$name.sha256")
          sha="$(cut -d' ' -f1 "$zip.sha256")"
          npx tsx scripts/release-notes.ts "$TAG" --zip "$zip" --sha256 "$sha" --repo-url "$REPO_URL" > release/notes.md
          cat release/notes.md
          gh release create "$TAG" "$zip" "$zip.sha256" \
            --title "$TAG" --notes-file release/notes.md --verify-tag
