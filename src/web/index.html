<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Drohnen-Livestream</title>
    <!-- Icons: favicon.svg is the source; the PNGs are rendered from it (ADR 0010). -->
    <link rel="icon" type="image/svg+xml" href="./assets/icons/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/icons/icon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/icons/apple-touch-icon.png" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#e8eef3" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#09111c" />
    <script>
      // Colour scheme before the first paint (src/web/lib/theme.ts): ?theme=tag|nacht, else
      // the stored choice, else the device setting via CSS.
      try {
        var q = new URLSearchParams(location.search).get("theme");
        var theme =
          { tag: "day", day: "day", nacht: "night", night: "night" }[q] || localStorage.getItem("dlsh.theme");
        if (theme === "day" || theme === "night") document.documentElement.dataset.theme = theme;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
